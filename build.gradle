plugins { id 'com.android.application' }

android {
    namespace 'com.esdy.shell'
    compileSdk 35

    defaultConfig {
        applicationId "com.esdy.shell"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "ESDYVERSIONPLACEHOLDER"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
