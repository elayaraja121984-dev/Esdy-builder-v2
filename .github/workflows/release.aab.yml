name: Release AAB (signed)
# Run manually: Actions > "Release AAB (signed)" > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Check release secrets exist
        env:
          K1: ${{ secrets.ESDY_KEYSTORE_BASE64 }}
          K2: ${{ secrets.ESDY_KEYSTORE_PASSWORD }}
          K3: ${{ secrets.ESDY_KEY_ALIAS }}
        run: |
          for v in K1 K2 K3; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub secret. Add ESDY_KEYSTORE_BASE64, ESDY_KEYSTORE_PASSWORD and ESDY_KEY_ALIAS (see tools/README-KEYSTORE.txt)"
              exit 1
            fi
          done

      - name: Restore keystore (kept only in the runner temp folder)
        env:
          KS_B64: ${{ secrets.ESDY_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/esdy-release.p12"
          echo "ESDY_KEYSTORE_PATH=$RUNNER_TEMP/esdy-release.p12" >> "$GITHUB_ENV"

      - name: Verify bundled offline ZIP reader
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/vendor/jszip.min.js
          grep -q 'JSZip' app/src/main/assets/vendor/jszip.min.js

      # The template app (:shell) is built and embedded automatically by :app.

      - name: Build signed Android App Bundle
        env:
          ESDY_KEYSTORE_PASSWORD: ${{ secrets.ESDY_KEYSTORE_PASSWORD }}
          ESDY_KEY_ALIAS: ${{ secrets.ESDY_KEY_ALIAS }}
          ESDY_KEY_PASSWORD: ${{ secrets.ESDY_KEYSTORE_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon

      - name: Build signed release APK (direct install file)
        env:
          ESDY_KEYSTORE_PASSWORD: ${{ secrets.ESDY_KEYSTORE_PASSWORD }}
          ESDY_KEY_ALIAS: ${{ secrets.ESDY_KEY_ALIAS }}
          ESDY_KEY_PASSWORD: ${{ secrets.ESDY_KEYSTORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ESDY-Builder-release.apk

      - name: Verify the signature
        env:
          PW: ${{ secrets.ESDY_KEYSTORE_PASSWORD }}
        run: |
          jarsigner -verify -verbose:summary app/build/outputs/bundle/release/app-release.aab | tail -5
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256|Valid"

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/esdy-release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: ESDY-Builder-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish signed APK as a GitHub Release (direct download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: ESDY Builder release #${{ github.run_number }}
          files: |
            ESDY-Builder-release.apk
            app/build/outputs/bundle/release/app-release.aab
