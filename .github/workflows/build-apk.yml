name: Build test APK

on:
push:
workflow_dispatch:

permissions:
contents: write

jobs:
apk:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3
    with:
      packages: |
        platform-tools
        platforms;android-35
        build-tools;34.0.0
      accept-android-sdk-licenses: true

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Verify bundled offline ZIP reader
    shell: bash
    run: |
      set -euo pipefail
      test -s app/src/main/assets/vendor/jszip.min.js
      grep -q 'JSZip' app/src/main/assets/vendor/jszip.min.js

  - name: Build ESDY Builder APK
    run: gradle :app:assembleDebug --no-daemon

  - name: Name and verify APK
    shell: bash
    run: |
      set -euo pipefail
      test -s app/build/outputs/apk/debug/app-debug.apk
      cp app/build/outputs/apk/debug/app-debug.apk ESDY-Builder.apk
      unzip -l ESDY-Builder.apk | grep -q 'assets/shell.apk'

  - name: Publish APK as a GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: apk-build-${{ github.run_number }}
      name: "ESDY Builder test APK #${{ github.run_number }}"
      prerelease: false
      make_latest: true
      files: ESDY-Builder.apk
